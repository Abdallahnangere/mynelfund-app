name: Deliver IPA to TestFlight

on:
  workflow_dispatch:

jobs:
  upload-to-apple:
    name: Deliver to TestFlight
    runs-on: macos-14
    steps:
      - name: Download IPA Asset from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.0-ios -p "my_nelfund.ipa" --repo Abdallahnangere/mynelfund-app
          ls -lh my_nelfund.ipa

      - name: Upload to TestFlight / App Store Connect
        env:
          APPLE_ID_USERNAME: ${{ secrets.APPLE_ID_USERNAME }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ASC_PROVIDER: ${{ secrets.APPLE_ASC_PROVIDER }}
        run: |
          echo "Delivering my_nelfund.ipa to Apple TestFlight..."
          xcrun altool --upload-app -f my_nelfund.ipa -t ios -u "$APPLE_ID_USERNAME" -p "$APPLE_APP_SPECIFIC_PASSWORD" --asc-provider "$APPLE_ASC_PROVIDER"
          echo "App successfully delivered to TestFlight!"
