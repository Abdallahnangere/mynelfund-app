name: Build and Package iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build Signed IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Apple Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: "temporal_keychain_password_123"
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Securely decode certificate and provisioning profile using Python
          export CERTIFICATE_PATH PP_PATH
          python3 -c "import base64, os; open(os.environ['CERTIFICATE_PATH'], 'wb').write(base64.b64decode(os.environ['BUILD_CERTIFICATE_BASE64'].replace('\ufeff', '').strip()))"
          python3 -c "import base64, os; open(os.environ['PP_PATH'], 'wb').write(base64.b64decode(os.environ['BUILD_PROVISION_PROFILE_BASE64'].replace('\ufeff', '').strip()))"

          # Verify certificate with OpenSSL
          openssl pkcs12 -in $CERTIFICATE_PATH -passin "pass:" -info -noout

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          # Apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/beb5972a-7073-41c9-9ea9-31fd41ca5901.mobileprovision

      - name: Install Flutter & CocoaPods Dependencies
        run: |
          flutter pub get
          cd ios && pod install --repo-update && cd ..

      - name: Build Signed IPA
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyNELFund-Signed-IPA
          path: build/ios/ipa/*.ipa
          retention-days: 14

      - name: Upload to TestFlight (if App Store Connect credentials exist)
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          if [ -n "$APP_STORE_CONNECT_ISSUER_ID" ] && [ -n "$APP_STORE_CONNECT_KEY_ID" ] && [ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            echo "App Store Connect credentials detected. Uploading to TestFlight..."
            mkdir -p ~/.appstoreconnect/private_keys
            python3 -c "import base64, os; open(os.path.expanduser(f'~/.appstoreconnect/private_keys/AuthKey_{os.environ[\"APP_STORE_CONNECT_KEY_ID\"]}.p8'), 'wb').write(base64.b64decode(os.environ['APP_STORE_CONNECT_API_KEY_BASE64'].replace('\ufeff', '').strip()))"
            xcrun altool --upload-app -f build/ios/ipa/*.ipa -t ios --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
            echo "Successfully uploaded to TestFlight!"
          else
            echo "Skipping automated upload (Issuer ID not provided). The signed IPA artifact is available for download above."
          fi
