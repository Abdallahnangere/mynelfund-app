name: my_nelfund
description: "Independent Nigerian student loan guide, eligibility checker, and statutory repayment simulator built with Flutter."
publish_to: 'none'
version: 2.2.7+13

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.3
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.2
  in_app_review: ^2.0.9
  in_app_update: ^4.2.3
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  firebase_analytics: ^11.4.4
  cloud_firestore: ^5.6.5
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
